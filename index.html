<style>
  :root {
    /* Brand-aligned palette: gold #EBB322, teal-navy #002850 */
    --bg-deep:     #020a1a;   /* deepened, slightly teal navy for starfield */
    --bg-mid:      #05152e;
    --bg-soft:     #0a2044;
    --ink:         #f5f1e8;
    --ink-soft:    #b9b4c7;
    --ink-faint:   #6b6880;
    --star-core:   #fff7e6;
    --brand-gold:  #EBB322;   /* the logo's primary yellow */
    --brand-gold-soft: #F0C84A;
    --brand-navy:  #002850;
    --star-warm:   #F0C84A;   /* softened brand gold for glows */
    --line:        rgba(255, 247, 230, 0.08);
    --line-active: rgba(235, 179, 34, 0.35);
    --accent:      #EBB322;
    --panel-bg:    rgba(5, 21, 46, 0.92);
    --panel-edge:  rgba(235, 179, 34, 0.18);
    --shadow-deep: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
    --px: 0px;
    --py: 0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ BACK TO SUBSTACK LINK ============ */
  .back-to-substack {
    pointer-events: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px 8px 10px;
    border-radius: 100px;
    transition: all 0.3s ease;
    margin-right: 4px;
  }

  .back-to-substack:hover {
    color: var(--star-warm);
  }

  .back-to-substack::before {
    content: '←';
    font-family: serif;
    font-size: 14px;
    transition: transform 0.3s ease;
  }

  .back-to-substack:hover::before {
    transform: translateX(-3px);
  }

  /* ============ COSMIC BACKDROP — parallax with cursor ============ */
  body::before {
    content: '';
    position: fixed;
    inset: -40px;
    background:
      radial-gradient(ellipse 70% 50% at 20% 20%, rgba(125, 211, 192, 0.07), transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(235, 179, 34, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 60% 30%, rgba(235, 179, 34, 0.04), transparent 70%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
    pointer-events: none;
    z-index: 0;
    transform: translate(calc(var(--px) * -1), calc(var(--py) * -1));
    transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: overlay;
  }

  /* ============ AMBIENT BACKGROUND STAR FIELD ============ */
  .bg-stars {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    transform: translate(calc(var(--px) * 0.4), calc(var(--py) * 0.4));
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bg-stars circle { fill: var(--ink); }

  /* ============ HEADER ============ */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    padding: 28px 40px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
    pointer-events: none;
    opacity: 0;
    animation: fadeDown 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    pointer-events: auto;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .brand-mark {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 0 1px rgba(235, 179, 34, 0.3),
      0 0 24px rgba(235, 179, 34, 0.25),
      0 6px 24px -8px rgba(0, 0, 0, 0.6);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease;
    animation: markBreathe 5s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes markBreathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(235, 179, 34, 0.3), 0 0 24px rgba(235, 179, 34, 0.25), 0 6px 24px -8px rgba(0, 0, 0, 0.6); }
    50%      { box-shadow: 0 0 0 1px rgba(235, 179, 34, 0.4), 0 0 36px rgba(235, 179, 34, 0.4),  0 6px 24px -8px rgba(0, 0, 0, 0.6); }
  }

  .brand-mark:hover {
    transform: scale(1.05) rotate(-4deg);
  }

  .brand-text { flex: 1; min-width: 0; }

  .brand-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .brand-title {
    font-family: 'Instrument Serif', serif;
    font-size: 36px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .brand-title em {
    font-style: italic;
    background: linear-gradient(120deg, #F0C84A, #EBB322, #FFDB6B, #EBB322, #F0C84A);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 8s linear infinite;
  }

  .brand-au {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    font-size: 0.5em;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    vertical-align: 0.6em;
    margin-left: 0.25em;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .brand-tagline {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
    max-width: 340px;
    line-height: 1.5;
  }

  .platforms {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .platform-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 8px 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 100px;
    text-decoration: none;
    background: rgba(14, 16, 48, 0.4);
    backdrop-filter: blur(8px);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .platform-pill:hover {
    color: var(--ink);
    border-color: var(--star-warm);
    background: rgba(255, 217, 168, 0.08);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px -8px rgba(255, 217, 168, 0.4);
  }

  .platform-pill[data-empty="true"] { opacity: 0.45; cursor: default; }
  .platform-pill[data-empty="true"]:hover {
    color: var(--ink-soft);
    border-color: var(--panel-edge);
    background: rgba(14, 16, 48, 0.4);
    transform: none;
    box-shadow: none;
  }

  /* ============ STAGE — parallax target for the constellation ============ */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(calc(var(--px) * 0.6), calc(var(--py) * 0.6));
    transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #constellation { width: 100%; height: 100%; }

  /* ============ CONNECTION LINES — draw themselves on load ============ */
  .connection {
    stroke: var(--line);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: var(--length);
    stroke-dashoffset: var(--length);
    animation: drawLine 1.4s cubic-bezier(0.65, 0, 0.35, 1) var(--draw-delay, 0s) forwards;
    transition: stroke 0.5s ease, stroke-width 0.5s ease, opacity 0.5s ease;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .connection.highlighted {
    stroke-width: 1.5;
    opacity: 1;
  }

  .connection.dimmed { opacity: 0.15; }

  .connection.ripple {
    stroke: var(--line-active);
  }

  /* ============ STARS ============ */
  .star-group {
    cursor: pointer;
    opacity: 0;
    animation: fadeStar 0.9s cubic-bezier(0.22, 1, 0.36, 1) var(--entry-delay, 0s) forwards;
  }

  @keyframes fadeStar {
    to { opacity: 1; }
  }

  /* Inner drift wrapper — ambient subtle motion.
     Each star drifts on its own phase so the cluster feels alive. */
  .star-drift {
    animation: drift 18s ease-in-out infinite var(--drift-delay, 0s);
    transform-origin: center;
    transform-box: fill-box;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(3px, -2px); }
    40%      { transform: translate(-2px, 3px); }
    60%      { transform: translate(2px, 2px); }
    80%      { transform: translate(-3px, -1px); }
  }

  .star-halo {
    fill: var(--star-warm);
    opacity: 0.04;
    transform-origin: center;
    transform-box: fill-box;
    animation: haloBreathe 7s ease-in-out infinite var(--halo-delay, 0s);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  @keyframes haloBreathe {
    0%, 100% { opacity: 0.04; transform: scale(1); }
    50%      { opacity: 0.10; transform: scale(1.15); }
  }

  .star-group:hover .star-halo {
    opacity: 0.32 !important;
    transform: scale(1.3) !important;
    animation: none;
  }
  .star-group.active .star-halo {
    opacity: 0.42 !important;
    transform: scale(1.35) !important;
    animation: none;
  }

  .star-core {
    fill: var(--star-core);
    filter: drop-shadow(0 0 12px rgba(255, 247, 230, 0.8))
            drop-shadow(0 0 24px rgba(255, 217, 168, 0.4));
    transform-origin: center;
    transform-box: fill-box;
    animation: twinkle 4s ease-in-out infinite var(--twinkle-delay, 0s);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 1;   }
    50%      { opacity: 0.72; }
  }

  .star-group:hover .star-core { transform: scale(1.35); }
  .star-group.active .star-core { transform: scale(1.45); }

  .star-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    fill: var(--ink-soft);
    text-anchor: middle;
    transition: fill 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
  }

  .star-group:hover .star-label,
  .star-group.active .star-label { fill: var(--ink); }

  .star-group.dimmed .star-core,
  .star-group.dimmed .star-halo,
  .star-group.dimmed .star-label { opacity: 0.22; }

  /* ============ CLICK BURST ============ */
  .burst-particle {
    fill: var(--star-warm);
    animation: burst 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    filter: drop-shadow(0 0 4px var(--star-warm));
  }

  @keyframes burst {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(0.2); }
  }

  /* ============ SHOOTING STARS ============ */
  .shooting-star {
    position: absolute;
    top: var(--start-y);
    left: var(--start-x);
    width: 140px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 247, 230, 0.9), transparent);
    transform: rotate(var(--angle)) translateX(-200px);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    animation: shootingStar 1.6s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    filter: drop-shadow(0 0 4px rgba(255, 217, 168, 0.6));
  }

  @keyframes shootingStar {
    0%   { opacity: 0; transform: rotate(var(--angle)) translateX(-200px); }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--angle)) translateX(600px); }
  }

  /* ============ LEGEND ============ */
  .legend {
    position: fixed;
    bottom: 24px;
    left: 40px;
    z-index: 15;
    max-width: 280px;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .legend-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .legend-items { display: flex; flex-wrap: wrap; gap: 6px; }

  .theme-chip {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 100px;
    background: rgba(14, 16, 48, 0.6);
    border: 1px solid var(--panel-edge);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(6px);
  }

  .theme-chip::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--chip-color);
    box-shadow: 0 0 8px var(--chip-color);
    transition: box-shadow 0.3s ease;
  }

  .theme-chip:hover {
    color: var(--ink);
    border-color: var(--chip-color);
    transform: translateY(-1px);
  }
  .theme-chip:hover::before { box-shadow: 0 0 14px var(--chip-color); }

  .theme-chip.active {
    color: var(--ink);
    border-color: var(--chip-color);
    background: color-mix(in srgb, var(--chip-color) 14%, transparent);
  }
  .theme-chip.active::before { box-shadow: 0 0 16px var(--chip-color); }

  /* ============ STATS ============ */
  .stats {
    position: fixed;
    bottom: 24px;
    right: 40px;
    z-index: 15;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
  }

  .stats strong {
    color: var(--star-warm);
    font-weight: 500;
    font-size: 14px;
  }

  /* ============ EPISODE PANEL ============ */
  .panel {
    position: fixed;
    top: 50%;
    right: 40px;
    transform: translateY(-50%) translateX(calc(100% + 80px));
    z-index: 30;
    width: 440px;
    max-width: calc(100vw - 80px);
    max-height: 80vh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 32px 30px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-deep);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto;
  }

  .panel.open { transform: translateY(-50%) translateX(0); }

  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: var(--panel-edge); border-radius: 2px; }

  .panel-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--panel-edge);
    background: transparent;
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .panel-close:hover {
    color: var(--ink);
    border-color: var(--star-warm);
    transform: rotate(90deg);
  }

  /* Staggered content fade-in when panel opens */
  .panel.open .panel-stagger > * {
    opacity: 0;
    transform: translateY(8px);
    animation: panelItem 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .panel.open .panel-stagger > *:nth-child(1) { animation-delay: 0.15s; }
  .panel.open .panel-stagger > *:nth-child(2) { animation-delay: 0.22s; }
  .panel.open .panel-stagger > *:nth-child(3) { animation-delay: 0.29s; }
  .panel.open .panel-stagger > *:nth-child(4) { animation-delay: 0.36s; }
  .panel.open .panel-stagger > *:nth-child(5) { animation-delay: 0.43s; }
  .panel.open .panel-stagger > *:nth-child(6) { animation-delay: 0.50s; }
  .panel.open .panel-stagger > *:nth-child(7) { animation-delay: 0.57s; }
  .panel.open .panel-stagger > *:nth-child(8) { animation-delay: 0.64s; }
  .panel.open .panel-stagger > *:nth-child(9) { animation-delay: 0.71s; }
  .panel.open .panel-stagger > *:nth-child(10){ animation-delay: 0.78s; }

  @keyframes panelItem {
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }

  .panel-title {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin-bottom: 24px;
    color: var(--ink);
  }

  .panel-guest {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid var(--panel-edge);
    border-bottom: 1px solid var(--panel-edge);
    margin-bottom: 22px;
  }

  .guest-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0C84A, #EBB322);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 20px;
    font-style: italic;
    color: var(--brand-navy);
    flex-shrink: 0;
    animation: avatarPulse 3s ease-in-out infinite;
  }

  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(235, 179, 34, 0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(235, 179, 34, 0); }
  }

  .guest-info { min-width: 0; }

  .guest-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .guest-role {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .panel-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 22px 0 12px;
  }

  .panel-themes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }

  .panel-theme-chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--chip-color);
    color: var(--ink);
    background: color-mix(in srgb, var(--chip-color) 10%, transparent);
  }

  .panel-insights {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel-insights li {
    position: relative;
    padding-left: 20px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
  }

  .panel-insights li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--star-warm);
    box-shadow: 0 0 8px var(--star-warm);
  }

  .panel-standout {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    padding: 16px 18px;
    border-left: 2px solid var(--star-warm);
    background: rgba(255, 217, 168, 0.04);
    border-radius: 0 8px 8px 0;
  }

  .panel-links {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .panel-link {
    flex: 1;
    min-width: 95px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 11px 14px;
    text-align: center;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--ink-soft);
    text-decoration: none;
    background: rgba(14, 16, 48, 0.4);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .panel-link:hover {
    color: var(--ink);
    border-color: var(--star-warm);
    background: rgba(255, 217, 168, 0.08);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px -8px rgba(255, 217, 168, 0.4);
  }

  .panel-link[data-empty="true"] { opacity: 0.35; cursor: default; }
  .panel-link[data-empty="true"]:hover {
    color: var(--ink-soft);
    border-color: var(--panel-edge);
    background: rgba(14, 16, 48, 0.4);
    transform: none;
    box-shadow: none;
  }

  /* ============ HINT ============ */
  .hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    text-align: center;
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    font-style: italic;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: fadeHint 1s 2s ease forwards;
    pointer-events: none;
  }

  .hint::before {
    content: '✦';
    display: block;
    color: var(--star-warm);
    font-size: 14px;
    font-style: normal;
    margin-bottom: 4px;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes fadeHint { to { opacity: 1; } }

  .panel.open ~ .hint { opacity: 0 !important; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 768px) {
    .header { padding: 20px; gap: 16px; flex-direction: column; }
    .brand-title { font-size: 28px; }
    .brand-tagline { max-width: 100%; }
    .platforms { flex-wrap: wrap; }
    .legend { left: 16px; right: 16px; bottom: 16px; max-width: none; }
    .stats { display: none; }
    .panel {
      right: 16px; left: 16px; top: auto; bottom: 0;
      transform: translateY(calc(100% + 40px));
      width: auto;
      max-height: 75vh;
      border-radius: 18px 18px 0 0;
    }
    .panel.open { transform: translateY(0); }
    .panel-title { font-size: 26px; }
    .search-input { width: 100%; }
    .search-input:focus { width: 100%; }
    .search-results { width: 100%; }
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .connection { stroke-dashoffset: 0 !important; }
    .star-group { opacity: 1 !important; }
    .shooting-star { display: none; }
    .nebula-layer { animation: none !important; }
    .cursor-trail { display: none; }
    .connection.path-glow { animation: none !important; }
  }

  /* ============ NEBULA CLOUDS ============ */
  .nebula {
    position: fixed;
    inset: -60px;
    z-index: 1;
    pointer-events: none;
    transform: translate(calc(var(--px) * 0.2), calc(var(--py) * 0.2));
    transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .nebula-layer {
    position: absolute;
    inset: 0;
    mix-blend-mode: screen;
  }

  .nebula-layer:nth-child(1) {
    background:
      radial-gradient(ellipse 55% 45% at 18% 25%, rgba(125, 211, 192, 0.18), transparent 65%),
      radial-gradient(ellipse 45% 55% at 82% 70%, rgba(235, 179, 34, 0.20), transparent 60%);
    animation: nebulaDrift1 35s ease-in-out infinite;
  }

  .nebula-layer:nth-child(2) {
    background:
      radial-gradient(ellipse 50% 40% at 65% 20%, rgba(167, 139, 250, 0.14), transparent 65%),
      radial-gradient(ellipse 40% 50% at 30% 75%, rgba(209, 131, 201, 0.10), transparent 60%);
    animation: nebulaDrift2 45s ease-in-out infinite;
  }

  .nebula-layer:nth-child(3) {
    background:
      radial-gradient(ellipse 60% 35% at 50% 50%, rgba(102, 197, 212, 0.12), transparent 65%),
      radial-gradient(ellipse 35% 55% at 75% 40%, rgba(255, 142, 114, 0.10), transparent 60%);
    animation: nebulaDrift3 55s ease-in-out infinite;
  }

  @keyframes nebulaDrift1 {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(30px, -20px); }
    50%      { transform: translate(-15px, 35px); }
    75%      { transform: translate(-30px, -10px); }
  }

  @keyframes nebulaDrift2 {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-25px, 40px); }
    50%      { transform: translate(35px, 15px); }
    75%      { transform: translate(20px, -35px); }
  }

  @keyframes nebulaDrift3 {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(40px, 25px); }
    50%      { transform: translate(-30px, -40px); }
    75%      { transform: translate(-15px, 50px); }
  }

  /* ============ CURSOR TRAIL ============ */
  .cursor-trail {
    position: fixed;
    inset: 0;
    z-index: 7;
    pointer-events: none;
  }

  .trail-particle {
    fill: var(--star-warm);
    animation: trailFade 500ms ease-out forwards;
  }

  @keyframes trailFade {
    0%   { opacity: 0.6; transform: scale(1) translateY(0); }
    100% { opacity: 0;   transform: scale(0.3) translateY(8px); }
  }

  /* ============ SEASON ORBIT RINGS ============ */
  .season-ring {
    fill: none;
    stroke: rgba(255, 247, 230, 0.04);
    stroke-width: 1;
    stroke-dasharray: 4 8;
    opacity: 0;
    animation: fadeRing 1s ease forwards;
    animation-delay: 2.5s;
  }

  .season-ring-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    fill: var(--ink-faint);
    opacity: 0.5;
    text-anchor: middle;
  }

  @keyframes fadeRing {
    to { opacity: 1; }
  }

  /* ============ RELATED EPISODES PATH ============ */
  .star-group.related .star-halo {
    opacity: 0.25 !important;
    transform: scale(1.15) !important;
    animation: none !important;
  }

  .star-group.related .star-core {
    filter: drop-shadow(0 0 16px rgba(255, 247, 230, 0.9))
            drop-shadow(0 0 28px rgba(255, 217, 168, 0.5));
  }

  .star-group.related .star-label {
    fill: var(--ink);
  }

  .connection.path-glow {
    stroke: var(--line-active);
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    opacity: 1;
    animation: pathFlow 2s linear infinite;
  }

  @keyframes pathFlow {
    to { stroke-dashoffset: -20; }
  }

  /* ---- "Explore next" card in panel ---- */
  .panel-next {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    background: rgba(14, 16, 48, 0.4);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    text-align: left;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .panel-next:hover {
    border-color: var(--star-warm);
    background: rgba(255, 217, 168, 0.08);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px -8px rgba(255, 217, 168, 0.4);
  }

  .panel-next .guest-avatar {
    width: 36px;
    height: 36px;
    font-size: 15px;
    flex-shrink: 0;
    animation: none;
  }

  .panel-next .guest-name {
    font-size: 13px;
    font-weight: 600;
  }

  .panel-next .guest-role {
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* ============ SEARCH / GUEST SPOTLIGHT ============ */
  .search {
    margin-bottom: 14px;
    position: relative;
  }

  .search-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: rgba(14, 16, 48, 0.6);
    border: 1px solid var(--panel-edge);
    border-radius: 100px;
    padding: 9px 16px;
    width: 220px;
    outline: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .search-input::placeholder {
    color: var(--ink-faint);
  }

  .search-input:focus {
    width: 280px;
    border-color: var(--star-warm);
    box-shadow: 0 0 16px rgba(235, 179, 34, 0.15);
  }

  .search-results {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    width: 300px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
    display: none;
  }

  .search-results.visible {
    display: block;
  }

  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(235, 179, 34, 0.08);
    color: var(--ink);
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    text-align: left;
    transition: background 0.2s ease;
  }

  .search-result:last-child { border-bottom: none; }

  .search-result:hover {
    background: rgba(255, 217, 168, 0.08);
  }

  .search-result .guest-avatar {
    width: 28px;
    height: 28px;
    font-size: 11px;
    flex-shrink: 0;
    animation: none;
  }

  .search-result-title {
    font-size: 12px;
    font-weight: 600;
  }

  .search-result-guest {
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* Spotlight sonar ping */
  .star-group.spotlight .star-halo {
    animation: spotlightPing 1.5s ease-out forwards !important;
  }

  .star-group.spotlight .star-core {
    transform: scale(1.6);
    transition: transform 0.3s ease;
  }

  @keyframes spotlightPing {
    0%   { opacity: 0.15; transform: scale(1); }
    40%  { opacity: 0.5;  transform: scale(2.5); }
    100% { opacity: 0.04; transform: scale(1); }
  }
</style>
</head>

<script>
/* ============================================================
   WHAT THE TECH — SEASON CONSTELLATION
   ============================================================
   
   HOW TO ADD A NEW EPISODE:
   1. Find the "EPISODES DATA" block below
   2. Copy the template shown in the comments
   3. Fill in: season, number, title, guest, themes, insights, standout, links
   4. Save. The constellation re-layouts automatically.
   
   HOW TO UPDATE PLATFORM LINKS:
   - podcast.platforms = top-right pills (season-level links)
   - episodes[n].links = per-episode links in the detail panel
   
   HOW TO ADD A NEW THEME:
   - Add { id, name, color } to the "themes" array
   - Reference it by id in any episode's themes array
   ============================================================ */

// DATA is loaded from episodes.json at runtime so adding episodes only
// requires editing the JSON file — no edits to this HTML are needed.
let DATA = null;
async function loadData() {
  // Cache-bust by appending a timestamp so GitHub Pages serves the latest data
  const url = 'episodes.json?v=' + Date.now();
  const r = await fetch(url);
  if (!r.ok) throw new Error('Could not load episodes.json (HTTP ' + r.status + ')');
  DATA = await r.json();
}

/* ============================================================
   RENDERING ENGINE
   ============================================================ */

// themesById is built once after DATA loads, then reused
let themesById = {};
const svg = document.getElementById('constellation');
const bgStarsSvg = document.getElementById('bgStars');
const SVG_NS = 'http://www.w3.org/2000/svg';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let activeEpisode = null;
let activeTheme = null;

/* ---- Golden-spiral positioning: scales gracefully with episode count ---- */
function computePositions(episodes, cx, cy, scale) {
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  return episodes.map((ep, i) => {
    const t = i + 1.2;
    const radius = scale * Math.sqrt(t);
    const angle = i * goldenAngle - Math.PI / 2;
    return {
      ...ep,
      x: cx + radius * Math.cos(angle),
      y: cy + radius * Math.sin(angle)
    };
  });
}

/* ---- Ambient background star field ---- */
function renderBgStars() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  bgStarsSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  bgStarsSvg.innerHTML = '';
  const count = Math.min(120, Math.max(60, Math.round((w * h) / 18000)));
  for (let i = 0; i < count; i++) {
    const c = document.createElementNS(SVG_NS, 'circle');
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() < 0.85 ? Math.random() * 0.8 + 0.3 : Math.random() * 1.4 + 0.8;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', r);
    c.setAttribute('opacity', (Math.random() * 0.5 + 0.1).toFixed(2));
    bgStarsSvg.appendChild(c);
  }
}

/* ---- Main constellation render ---- */
function render() {
  const rect = svg.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const cx = w / 2;
  const cy = h / 2;
  const scale = Math.min(w, h) * 0.11;

  const placed = computePositions(DATA.episodes, cx, cy, scale);

  svg.innerHTML = '';

  // season orbit rings
  const ringsGroup = document.createElementNS(SVG_NS, 'g');
  ringsGroup.setAttribute('class', 'season-rings');
  const seasonMap = {};
  placed.forEach(ep => {
    const s = ep.season;
    if (!seasonMap[s]) seasonMap[s] = [];
    const dx = ep.x - cx;
    const dy = ep.y - cy;
    seasonMap[s].push(Math.hypot(dx, dy));
  });
  Object.entries(seasonMap).forEach(([season, radii]) => {
    const avgRadius = radii.reduce((a, b) => a + b, 0) / radii.length;
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('cx', cx);
    ring.setAttribute('cy', cy);
    ring.setAttribute('r', avgRadius);
    ring.setAttribute('class', 'season-ring');
    ringsGroup.appendChild(ring);

    const label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('x', cx);
    label.setAttribute('y', cy - avgRadius - 8);
    label.setAttribute('class', 'season-ring-label');
    label.textContent = `S${season}`;
    ringsGroup.appendChild(label);
  });
  svg.appendChild(ringsGroup);

  // connections
  const linesGroup = document.createElementNS(SVG_NS, 'g');
  linesGroup.setAttribute('class', 'connections');
  let connectionIdx = 0;
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const shared = placed[i].themes.filter(t => placed[j].themes.includes(t));
      if (shared.length === 0) continue;
      const line = document.createElementNS(SVG_NS, 'line');
      const dx = placed[j].x - placed[i].x;
      const dy = placed[j].y - placed[i].y;
      const length = Math.hypot(dx, dy);
      line.setAttribute('x1', placed[i].x);
      line.setAttribute('y1', placed[i].y);
      line.setAttribute('x2', placed[j].x);
      line.setAttribute('y2', placed[j].y);
      line.setAttribute('class', 'connection');
      line.setAttribute('data-from', placed[i].id);
      line.setAttribute('data-to', placed[j].id);
      line.setAttribute('data-themes', shared.join(','));
      line.style.setProperty('--length', length);
      line.style.setProperty('--draw-delay', (0.4 + connectionIdx * 0.08) + 's');
      linesGroup.appendChild(line);
      connectionIdx++;
    }
  }
  svg.appendChild(linesGroup);

  // stars
  placed.forEach((ep, i) => {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'star-group');
    g.setAttribute('data-id', ep.id);
    g.setAttribute('transform', `translate(${ep.x}, ${ep.y})`);
    g.style.setProperty('--entry-delay', (0.5 + i * 0.12) + 's');

    const drift = document.createElementNS(SVG_NS, 'g');
    drift.setAttribute('class', 'star-drift');
    drift.style.setProperty('--drift-delay', (-i * 2.3) + 's');

    const halo = document.createElementNS(SVG_NS, 'circle');
    halo.setAttribute('r', 24);
    halo.setAttribute('class', 'star-halo');
    halo.style.setProperty('--halo-delay', (-i * 1.7) + 's');
    drift.appendChild(halo);

    const core = document.createElementNS(SVG_NS, 'circle');
    core.setAttribute('r', 5);
    core.setAttribute('class', 'star-core');
    core.style.setProperty('--twinkle-delay', (-i * 0.9) + 's');
    drift.appendChild(core);

    const label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('class', 'star-label');
    label.setAttribute('y', 32);
    label.textContent = `S${String(ep.season).padStart(2,'0')}·E${String(ep.number).padStart(2,'0')}`;
    drift.appendChild(label);

    g.appendChild(drift);

    g.addEventListener('click', () => {
      openPanel(ep.id);
      createClickBurst(ep.x, ep.y);
    });

    g.addEventListener('mouseenter', () => highlightConnections(ep.id));
    g.addEventListener('mouseleave', () => clearConnectionRipple());

    svg.appendChild(g);
  });
}

/* ---- Hover: ripple highlight on connections touching this star ---- */
function highlightConnections(epId) {
  if (activeTheme) return; // theme filter takes precedence
  document.querySelectorAll('.connection').forEach(line => {
    const involved = line.dataset.from === epId || line.dataset.to === epId;
    line.classList.toggle('ripple', involved);
  });
}
function clearConnectionRipple() {
  document.querySelectorAll('.connection').forEach(line => line.classList.remove('ripple'));
}

/* ---- Find the most-connected related episode for "Explore next" ---- */
function findBestNextEpisode(currentEp) {
  const currentThemes = new Set(currentEp.themes);
  let best = null;
  let bestShared = 0;
  let bestTotal = 0;

  DATA.episodes.forEach(ep => {
    if (ep.id === currentEp.id) return;
    const shared = ep.themes.filter(t => currentThemes.has(t)).length;
    if (shared === 0) return;
    const total = ep.themes.length;
    if (shared > bestShared || (shared === bestShared && total > bestTotal)) {
      best = ep;
      bestShared = shared;
      bestTotal = total;
    }
  });
  return best;
}

/* ---- Highlight stars and lines related to active episode ---- */
function highlightRelatedEpisodes(epId) {
  if (activeTheme) return; // theme filter takes precedence
  const ep = DATA.episodes.find(e => e.id === epId);
  if (!ep) return;
  const epThemes = new Set(ep.themes);

  const relatedIds = new Set();
  DATA.episodes.forEach(other => {
    if (other.id === epId) return;
    if (other.themes.some(t => epThemes.has(t))) relatedIds.add(other.id);
  });

  document.querySelectorAll('.star-group').forEach(g => {
    const id = g.dataset.id;
    if (id === epId) return; // active star already styled
    if (relatedIds.has(id)) g.classList.add('related');
    else g.classList.add('dimmed');
  });

  document.querySelectorAll('.connection').forEach(line => {
    const from = line.dataset.from;
    const to = line.dataset.to;
    const touchesActive = from === epId || to === epId;
    const touchesRelated = relatedIds.has(from) || relatedIds.has(to);
    if (touchesActive && touchesRelated) {
      line.classList.add('path-glow');
      line.classList.remove('dimmed');
    } else {
      line.classList.add('dimmed');
      line.classList.remove('path-glow');
    }
  });
}

function clearRelatedHighlights() {
  document.querySelectorAll('.star-group').forEach(g => {
    g.classList.remove('related', 'dimmed');
  });
  document.querySelectorAll('.connection').forEach(line => {
    line.classList.remove('path-glow', 'dimmed');
  });
}

/* ---- Click burst: radial sparkle shower at a star position ---- */
function createClickBurst(x, y) {
  if (reducedMotion) return;
  const burstGroup = document.createElementNS(SVG_NS, 'g');
  burstGroup.setAttribute('transform', `translate(${x}, ${y})`);
  burstGroup.style.pointerEvents = 'none';

  const particleCount = 10;
  for (let i = 0; i < particleCount; i++) {
    const angle = (i / particleCount) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 30 + Math.random() * 20;
    const p = document.createElementNS(SVG_NS, 'circle');
    p.setAttribute('r', 1.4);
    p.setAttribute('class', 'burst-particle');
    p.style.setProperty('--bx', (Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--by', (Math.sin(angle) * dist) + 'px');
    burstGroup.appendChild(p);
  }
  svg.appendChild(burstGroup);
  setTimeout(() => burstGroup.remove(), 1000);
}

/* ---- Occasional shooting stars across backdrop ---- */
function spawnShootingStar() {
  if (reducedMotion || document.hidden) return;
  const el = document.createElement('div');
  el.className = 'shooting-star';
  const startY = 10 + Math.random() * (window.innerHeight * 0.5);
  const startX = Math.random() * window.innerWidth * 0.3;
  const angle = 15 + Math.random() * 20;
  el.style.setProperty('--start-y', startY + 'px');
  el.style.setProperty('--start-x', startX + 'px');
  el.style.setProperty('--angle', angle + 'deg');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}
function startShootingStars() {
  function schedule() {
    const delay = 8000 + Math.random() * 14000; // every 8–22 seconds
    setTimeout(() => { spawnShootingStar(); schedule(); }, delay);
  }
  schedule();
}

/* ---- Mouse parallax: eases backdrop + stage toward cursor ---- */
function setupParallax() {
  if (reducedMotion) return;
  let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
  document.addEventListener('mousemove', e => {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    targetX = ((e.clientX - cx) / cx) * 18;
    targetY = ((e.clientY - cy) / cy) * 12;
  });
  function tick() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;
    document.documentElement.style.setProperty('--px', currentX.toFixed(2) + 'px');
    document.documentElement.style.setProperty('--py', currentY.toFixed(2) + 'px');
    requestAnimationFrame(tick);
  }
  tick();
}

/* ---- Comet cursor trail: stardust particles follow the mouse ---- */
function setupCursorTrail() {
  if (reducedMotion || 'ontouchstart' in window) return;
  const trailSvg = document.getElementById('cursorTrail');
  let lastEmit = 0;

  function resizeTrailSvg() {
    trailSvg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
  }
  resizeTrailSvg();
  window.addEventListener('resize', resizeTrailSvg);

  document.addEventListener('mousemove', e => {
    const now = Date.now();
    if (now - lastEmit < 40) return;
    lastEmit = now;
    if (document.hidden) return;

    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', e.clientX);
    c.setAttribute('cy', e.clientY);
    c.setAttribute('r', 1.5);
    c.setAttribute('class', 'trail-particle');
    trailSvg.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  });
}

/* ---- Search / Guest Spotlight ---- */
function setupSearch() {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) {
      results.classList.remove('visible');
      results.innerHTML = '';
      return;
    }

    const matches = DATA.episodes.filter(ep =>
      ep.title.toLowerCase().includes(q) ||
      ep.guest.name.toLowerCase().includes(q)
    ).slice(0, 5);

    if (matches.length === 0) {
      results.classList.remove('visible');
      results.innerHTML = '';
      return;
    }

    results.innerHTML = matches.map(ep => `
      <button class="search-result" role="option" data-id="${ep.id}">
        <div class="guest-avatar">${escapeHtml(ep.guest.initials || '·')}</div>
        <div>
          <div class="search-result-title">${escapeHtml(ep.title)}</div>
          <div class="search-result-guest">${escapeHtml(ep.guest.name)}</div>
        </div>
      </button>
    `).join('');
    results.classList.add('visible');

    results.querySelectorAll('.search-result').forEach(btn => {
      btn.addEventListener('click', () => {
        const epId = btn.dataset.id;
        input.value = '';
        results.classList.remove('visible');
        results.innerHTML = '';
        spotlightEpisode(epId);
      });
    });
  });

  input.addEventListener('blur', () => {
    // Delay so click on result registers before hide
    setTimeout(() => {
      results.classList.remove('visible');
    }, 200);
  });

  // Escape dismisses search dropdown
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      input.value = '';
      input.blur();
      results.classList.remove('visible');
      results.innerHTML = '';
    }
  });
}

let spotlightTimer;
function spotlightEpisode(epId) {
  // Close existing panel and clear filters
  closePanel();
  if (activeTheme) setThemeFilter(activeTheme); // toggles off
  clearTimeout(spotlightTimer);

  // Add spotlight class
  const starGroup = document.querySelector(`.star-group[data-id="${epId}"]`);
  if (starGroup) {
    starGroup.classList.add('spotlight');
    setTimeout(() => starGroup.classList.remove('spotlight'), 1500);
  }

  // Open panel after a short delay so spotlight lands first
  spotlightTimer = setTimeout(() => openPanel(epId), 400);
}

/* ---- Episode detail panel ---- */
function openPanel(epId) {
  const ep = DATA.episodes.find(e => e.id === epId);
  if (!ep) return;

  const panel = document.getElementById('panel');
  const content = document.getElementById('panelContent');

  activeEpisode = epId;

  document.querySelectorAll('.star-group').forEach(g => {
    g.classList.toggle('active', g.dataset.id === epId);
  });

  const themeChips = ep.themes.map(tid => {
    const t = themesById[tid];
    if (!t) return '';
    return `<span class="panel-theme-chip" style="--chip-color:${t.color}">${t.name}</span>`;
  }).join('');

  const insights = ep.keyInsights.map(i => `<li>${escapeHtml(i)}</li>`).join('');

  const linkEntries = [
    { k: 'spotify', label: 'Spotify'  },
    { k: 'youtube', label: 'YouTube'  },
    { k: 'apple',   label: 'Apple'    }
  ];
  const links = linkEntries.map(l => {
    const url = ep.links?.[l.k];
    if (url) return `<a class="panel-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${l.label}</a>`;
    return `<span class="panel-link" data-empty="true">${l.label}</span>`;
  }).join('');

  const guestRoleLine = [ep.guest.role, ep.guest.company].filter(Boolean).join(' · ');

  content.innerHTML = `
    <div class="panel-meta">Season ${ep.season} · Episode ${ep.number}${ep.releaseDate ? ' · ' + formatDate(ep.releaseDate) : ''}</div>
    <h2 class="panel-title">${escapeHtml(ep.title)}</h2>
    <div class="panel-guest">
      <div class="guest-avatar">${escapeHtml(ep.guest.initials || '·')}</div>
      <div class="guest-info">
        <div class="guest-name">${escapeHtml(ep.guest.name)}</div>
        <div class="guest-role">${escapeHtml(guestRoleLine)}</div>
      </div>
    </div>
    <div class="panel-section-title">Themes</div>
    <div class="panel-themes">${themeChips}</div>
    <div class="panel-section-title">Key insights</div>
    <ul class="panel-insights">${insights}</ul>
    ${ep.standoutMoment ? `
      <div class="panel-section-title">Standout moment</div>
      <div class="panel-standout">${escapeHtml(ep.standoutMoment)}</div>
    ` : ''}
    <div class="panel-section-title">Listen</div>
    <div class="panel-links">${links}</div>
    ${(() => {
      const next = findBestNextEpisode(ep);
      if (!next) return '';
      return `
        <div class="panel-section-title">Explore next</div>
        <button class="panel-next" data-next-id="${next.id}">
          <div class="guest-avatar">${escapeHtml(next.guest.initials || '·')}</div>
          <div>
            <div class="guest-name">${escapeHtml(next.title)}</div>
            <div class="guest-role">${escapeHtml(next.guest.name)}</div>
          </div>
        </button>
      `;
    })()}
  `;

  // Retrigger the stagger animation when switching between episodes
  panel.classList.remove('open');
  void panel.offsetWidth; // force reflow
  panel.classList.add('open');

  // highlight related episodes on the constellation
  clearRelatedHighlights();
  highlightRelatedEpisodes(epId);

  // wire up "explore next" button
  const nextBtn = content.querySelector('.panel-next');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => openPanel(nextBtn.dataset.nextId));
  }
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.star-group').forEach(g => g.classList.remove('active'));
  clearRelatedHighlights();
  activeEpisode = null;
}

/* ---- Theme filter ---- */
function setThemeFilter(themeId) {
  activeTheme = activeTheme === themeId ? null : themeId;
  clearConnectionRipple();

  document.querySelectorAll('.theme-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.theme === activeTheme);
  });

  document.querySelectorAll('.star-group').forEach(g => {
    const ep = DATA.episodes.find(e => e.id === g.dataset.id);
    if (!activeTheme) g.classList.remove('dimmed');
    else              g.classList.toggle('dimmed', !ep.themes.includes(activeTheme));
  });

  document.querySelectorAll('.connection').forEach(line => {
    if (!activeTheme) {
      line.classList.remove('dimmed', 'highlighted');
      line.style.stroke = '';
      return;
    }
    const themes = (line.dataset.themes || '').split(',');
    if (themes.includes(activeTheme)) {
      line.classList.add('highlighted');
      line.classList.remove('dimmed');
      line.style.stroke = themesById[activeTheme].color;
    } else {
      line.classList.add('dimmed');
      line.classList.remove('highlighted');
      line.style.stroke = '';
    }
  });
}

/* ---- Header: platforms ---- */
function renderPlatforms() {
  const nav = document.getElementById('platforms');
  const p = DATA.podcast.platforms || {};
  const entries = [
    { k: 'spotify', label: 'Spotify'  },
    { k: 'youtube', label: 'YouTube'  },
    { k: 'apple',   label: 'Apple'    }
  ];
  const platformHTML = entries.map(e => {
    const url = p[e.k];
    if (url) return `<a class="platform-pill" href="${escapeAttr(url)}" target="_blank" rel="noopener">${e.label}</a>`;
    return `<span class="platform-pill" data-empty="true" title="Add a link in the DATA block">${e.label}</span>`;
  }).join('');
  // Optional back-to-Substack link sits to the left of the platform pills
  const substackUrl = DATA.podcast.substackUrl;
  const backHTML = substackUrl
    ? `<a class="back-to-substack" href="${escapeAttr(substackUrl)}" title="Back to the Substack">Substack</a>`
    : '';
  nav.innerHTML = backHTML + platformHTML;
}

/* ---- Legend ---- */
function renderLegend() {
  const container = document.getElementById('legendItems');
  const usedThemes = new Set();
  DATA.episodes.forEach(ep => ep.themes.forEach(t => usedThemes.add(t)));
  container.innerHTML = DATA.themes
    .filter(t => usedThemes.has(t.id))
    .map(t => `<button class="theme-chip" data-theme="${t.id}" style="--chip-color:${t.color}">${t.name}</button>`)
    .join('');
  container.querySelectorAll('.theme-chip').forEach(chip => {
    chip.addEventListener('click', () => setThemeFilter(chip.dataset.theme));
  });
}

/* ---- Stats ---- */
function renderStats() {
  const usedThemes = new Set();
  DATA.episodes.forEach(ep => ep.themes.forEach(t => usedThemes.add(t)));
  document.getElementById('stats').innerHTML =
    `<strong>${DATA.episodes.length}</strong> episodes · <strong>${usedThemes.size}</strong> themes`;
}

/* ---- utilities ---- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function formatDate(s) {
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
}

/* ============ BOOT ============ */
document.getElementById('panelClose').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// Load data, then run all the renders. If load fails, show a friendly error
// rather than a blank page.
loadData()
  .then(() => {
    themesById = Object.fromEntries(DATA.themes.map(t => [t.id, t]));
    renderBgStars();
    renderPlatforms();
    renderLegend();
    renderStats();
    render();
    setupParallax();
    startShootingStars();
    setupCursorTrail();
    setupSearch();
    setTimeout(spawnShootingStar, 3500);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderBgStars();
        render();
        if (activeEpisode) {
          const g = document.querySelector(`.star-group[data-id="${activeEpisode}"]`);
          if (g) g.classList.add('active');
          highlightRelatedEpisodes(activeEpisode);
        }
        if (activeTheme) setThemeFilter(activeTheme);
      }, 120);
    });
  })
  .catch(err => {
    document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f5f1e8;font-family:sans-serif;text-align:center;padding:40px;"><div><h2 style="font-family:Instrument Serif,serif;font-size:32px;margin-bottom:12px;">Could not load episodes</h2><p style="color:#b9b4c7;">' + err.message + '</p><p style="color:#6b6880;font-size:13px;margin-top:20px;">Check that <code>episodes.json</code> is in the same folder as this HTML file.</p></div></div>';
    console.error(err);
  });

</script>
